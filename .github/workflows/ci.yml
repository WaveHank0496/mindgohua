# 每次 push 或開 PR 時自動驗證這個專案。
#
# 為什麼需要它：在有 CI 之前，「測試有沒有過」取決於開發者記不記得手動跑。
# 人一定會忘記，而且通常是在趕時間、最容易改壞東西的時候忘記。
#
# 這份設定守住三件事，任何一件失敗都會讓 GitHub 上出現紅叉並寄信：
#   1. 核心邏輯測試（SessionEngine / ScrollRhythmAnalyzer / DayBoundary / ItemAdvanceCounter）
#   2. 隱私不變量（PrivacyInvariantTest —— 有人加回 INTERNET 權限就會紅）
#   3. app 還能不能編譯成 APK
#
# 第 2 點是這個專案最重要的一條。spec §0 的隱私原則不是靠註解維持的，
# 是靠一個會失敗的測試維持的，而 CI 是讓那個測試真的有人在跑的東西。

name: CI

on:
  # 每個分支的 push 都跑，不只 main。
  #
  # 理由：一人開發時，你會想在「還沒開 PR」的階段就知道東西有沒有壞，
  # 而不是等到要合併了才發現。這個 repo 是公開的，而公開 repo 的
  # GitHub Actions 額度沒有上限，所以多跑幾次不花錢。
  #
  # 代價是 PR 分支會跑兩次（push 一次、pull_request 一次）。
  # 以目前的規模這點浪費換到「早點知道壞了」很划算。
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # 允許在 GitHub 網頁上手動按按鈕觸發，debug CI 本身時很有用。
  workflow_dispatch:

# 同一個分支連續 push 時，取消還在跑的舊 run，不要浪費額度排隊。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 建置與測試
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      # gradle-wrapper.jar 是一個會被執行的二進位檔，而它就躺在 repo 裡。
      # 這一步確認它確實是 Gradle 官方發布的版本，沒有被掉包。
      - name: 驗證 Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: 安裝 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 這裡原本有一步 android-actions/setup-android@v3，用來「確保」Android SDK 就緒。
      # 它是整條 CI 唯一失敗的一步（run 35005294149），而且失敗原因是它自己的問題：
      # v3 以 node20 執行（GitHub 正在汰除），且預設安裝的 packages 含有 'tools' ——
      # 這個 SDK 套件早已從 Android 倉庫移除，新版 sdkmanager 找不到它。
      #
      # 移除而不是升級到 v4：GitHub 的 ubuntu runner 本來就預裝 Android SDK，
      # 授權也已接受，這個專案並不需要額外安裝。當初加它是為了防範一個假想問題，
      # 結果製造了一個真實問題。少一個依賴就少一個會壞的東西。
      #
      # 如果之後 Gradle 步驟真的因為缺少 SDK 元件而失敗，那就是它確實需要的證據，
      # 屆時再用 android-actions/setup-android@v4 加回來。

      # 快取 Gradle 的下載與建置產物。第一次會慢（約 5 分鐘），之後約 2 分鐘。
      - name: 設定 Gradle
        uses: gradle/actions/setup-gradle@v4

      # ── 第一關：純邏輯測試。最快、最該先擋下錯誤的地方。 ──
      - name: 單元測試
        run: ./gradlew :app:testDebugUnitTest --console=plain --stacktrace

      # ── 第二關：Android Lint。上架前 Play 會在意的問題大多這裡會先講。 ──
      # 目前不讓 lint 警告擋住整條 CI（continue-on-error），因為現有程式碼還沒清過一輪，
      # 一開始就設成硬性失敗會讓 CI 永遠是紅的，然後大家就開始無視它 —— 那比沒有 CI 更糟。
      # 等 lint 清乾淨後，這行要拿掉，改成真正的關卡。
      - name: Android Lint
        run: ./gradlew :app:lintDebug --console=plain
        continue-on-error: true

      # ── 第三關：真的能不能組出 APK。 ──
      - name: 建置 debug APK
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      # 失敗時把報告存下來，才能在 GitHub 上點開看是哪個測試爆的，
      # 而不是只看到一行紅字。if: always() 是關鍵 —— 預設只有成功才會跑。
      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*.html
          retention-days: 14
          if-no-files-found: ignore

      # debug APK 留著，方便你直接從 GitHub 下載安裝到手機上測，
      # 不必每次都接 USB 線重新 build。
      - name: 上傳 debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mindgohua-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: warn
